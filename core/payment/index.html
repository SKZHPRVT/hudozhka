<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Оплата — Художка.ПРО</title>
    <style>
        :root {
            --primary: #8B4513;
            --accent: #D2691E;
            --olive: #6B8E23;
            --bg-cream: #FAF6F0;
            --success: #4CAF50;
            --tg-hint: #999999;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-cream);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 100px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .app-header h1 {
            font-size: 18px;
            margin-bottom: 2px;
        }
        
        .app-header p {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .container {
            padding: 0 16px;
        }
        
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .tariff-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 10px 12px;
            cursor: pointer;
            margin-bottom: 6px;
        }
        
        .tariff-card.selected {
            border-color: var(--success);
            background: #f0f8f0;
        }
        
        .tariff-name {
            font-weight: 600;
            font-size: 14px;
        }
        
        .tariff-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .tariff-description {
            font-size: 11px;
            color: var(--tg-hint);
        }
        
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        
        .payment-method {
            background: white;
            padding: 10px 6px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .payment-method.selected {
            border-color: var(--success);
            background: #f0f8f0;
        }
        
        .payment-icon {
            font-size: 24px;
        }
        
        .payment-name {
            font-size: 10px;
            margin-top: 2px;
        }
        
        .summary {
            background: white;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 13px;
        }
        
        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
        }
        
        .pay-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            background: var(--success);
            color: white;
            cursor: pointer;
            margin-top: 16px;
        }
        
        .pay-btn:active {
            transform: scale(0.98);
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 20px;
            z-index: 100;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: var(--tg-hint);
            text-decoration: none;
            font-size: 12px;
        }
        
        .nav-item.active {
            color: var(--primary);
        }
        
        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
    </style>
    <link rel="stylesheet" href="../../shared/css/safe-area.css">
<style data-safe-area-inline>html,body{padding-top:60px !important;margin-top:0 !important;}.top-bar{margin-top:0 !important;padding-top:calc(12px + env(safe-area-inset-top, 48px)) !important;}.fun-header,.dashboard-header,.app-header,.admin-header,.teacher-header,.partner-header,.profile-header{padding-top:calc(16px + env(safe-area-inset-top, 48px)) !important;}</style>
</head>
<body>
    <div class="app-header">
        <h1>💳 Оплата</h1>
        <p>Выберите тариф и способ</p>
    </div>
    
    <div class="container">
        <div class="section-title">Тариф</div>
        <div id="tariffs"></div>
        
        <div class="section-title" style="margin-top: 12px;">Способ оплаты</div>
        <div class="payment-methods" id="paymentMethods"></div>
        
        <div class="summary">
            <div class="summary-row">
                <span>Тариф:</span>
                <strong id="selectedTariffName">—</strong>
            </div>
            <div class="summary-row">
                <span>Способ:</span>
                <strong id="selectedMethodName">—</strong>
            </div>
            <div class="summary-total">
                <span>Итого:</span>
                <strong id="totalPrice">0 ₽</strong>
            </div>
        </div>
        
        <button class="pay-btn" onclick="processPayment()">Оплатить</button>
    </div>
    
    <div class="bottom-nav">
        <a href="../calendar/index.html" class="nav-item">
            <span class="nav-icon">📅</span>
            <span>Календарь</span>
        </a>
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">💳</span>
            <span>Оплата</span>
        </a>
        <a href="../video/index.html" class="nav-item">
            <span class="nav-icon">📹</span>
            <span>Видео</span>
        </a>
    </div>
    
    <script src="../../shared/js/config.js"></script>
    <script>
        let tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand();
            tg.isFullscreen = true;
            tg.setHeaderColor('#8B4513');
            tg.setBackgroundColor('#FAF6F0');
            setTimeout(() => tg.expand(), 100);
            setTimeout(() => tg.expand(), 500);
            setTimeout(() => {
                tg.isFullscreen = true;
                tg.expand();
            }, 1000);
        }
        
        let selectedTariff = 'MONTHLY_8';
        let selectedMethod = 'YOOKASSA';
        
        function renderTariffs() {
            const container = document.getElementById('tariffs');
            const tariffs = Object.values(TARIFFS);
            const keys = Object.keys(TARIFFS);
            
            container.innerHTML = tariffs.map((tariff, index) => `
                <div class="tariff-card ${keys[index] === selectedTariff ? 'selected' : ''}" 
                     onclick="selectTariff('${keys[index]}', this)">
                    <div class="tariff-name">${tariff.name}</div>
                    <div class="tariff-price">${tariff.price} ₽</div>
                    <div class="tariff-description">${tariff.description}</div>
                </div>
            `).join('');
        }
        
        function selectTariff(key, element) {
            selectedTariff = key;
            document.querySelectorAll('.tariff-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('selectedTariffName').textContent = TARIFFS[key].name;
            document.getElementById('totalPrice').textContent = `${TARIFFS[key].price} ₽`;
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
        
        function renderPaymentMethods() {
            const container = document.getElementById('paymentMethods');
            const methods = Object.values(PAYMENT_METHODS);
            const keys = Object.keys(PAYMENT_METHODS);
            
            container.innerHTML = methods.map((method, index) => `
                <div class="payment-method ${keys[index] === selectedMethod ? 'selected' : ''}" 
                     onclick="selectMethod('${keys[index]}', this)">
                    <div class="payment-icon">${method.icon}</div>
                    <div class="payment-name">${method.name}</div>
                </div>
            `).join('');
        }
        
        function selectMethod(key, element) {
            selectedMethod = key;
            document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('selectedMethodName').textContent = PAYMENT_METHODS[key].name;
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
        
        function processPayment() {
            const tariff = TARIFFS[selectedTariff];
            const method = PAYMENT_METHODS[selectedMethod];
            
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            alert(`✅ Оплата прошла успешно!\n\nТариф: ${tariff.name}\nСумма: ${tariff.price} ₽\nСпособ: ${method.name}`);
            
            localStorage.setItem('payment_info', JSON.stringify({
                tariff: selectedTariff,
                method: selectedMethod,
                date: new Date().toISOString()
            }));
            
            setTimeout(() => {
                window.location.href = '../video/index.html';
            }, 1000);
        }
        
        renderTariffs();
        renderPaymentMethods();
        document.getElementById('selectedTariffName').textContent = TARIFFS[selectedTariff].name;
        document.getElementById('selectedMethodName').textContent = PAYMENT_METHODS[selectedMethod].name;
        document.getElementById('totalPrice').textContent = `${TARIFFS[selectedTariff].price} ₽`;
    </script>
    <script src="../../shared/js/safe-area.js"></script>
</body>
</html>
