<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Календарь — Художка.ПРО</title>
    <link rel="stylesheet" href="../../shared/css/main.css">
    <style>
        .calendar-container {
            padding: 16px;
        }
        
        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .month-selector h2 {
            font-size: 18px;
        }
        
        .month-nav {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }
        
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }
        
        .weekday {
            text-align: center;
            font-weight: 600;
            font-size: 12px;
            color: var(--tg-hint);
        }
        
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 20px;
        }
        
        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            position: relative;
        }
        
        .day:hover {
            background: var(--bg-cream);
        }
        
        .day.selected {
            background: var(--primary);
            color: white;
        }
        
        .day.today {
            border: 2px solid var(--olive);
        }
        
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .time-slot {
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .time-slot.available {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .time-slot.booked {
            background: #eee;
            color: var(--tg-hint);
            cursor: not-allowed;
        }
        
        .time-slot.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
    <link rel="stylesheet" href="../../shared/css/safe-area.css">
<style data-safe-area-inline>html,body{padding-top:60px !important;margin-top:0 !important;}.top-bar{margin-top:0 !important;padding-top:calc(12px + env(safe-area-inset-top, 48px)) !important;}.fun-header,.dashboard-header,.app-header,.admin-header,.teacher-header,.partner-header,.profile-header{padding-top:calc(16px + env(safe-area-inset-top, 48px)) !important;}</style>
</head>
<body>
    <div class="app-header">
        <h1>📅 Календарь занятий</h1>
        <p>Выберите дату и время</p>
    </div>
    
    <div class="calendar-container">
        <div class="month-selector">
            <button class="month-nav" onclick="changeMonth(-1)">←</button>
            <h2 id="monthTitle">Сентябрь 2026</h2>
            <button class="month-nav" onclick="changeMonth(1)">→</button>
        </div>
        
        <div class="weekdays">
            <div class="weekday">Пн</div>
            <div class="weekday">Вт</div>
            <div class="weekday">Ср</div>
            <div class="weekday">Чт</div>
            <div class="weekday">Пт</div>
            <div class="weekday">Сб</div>
            <div class="weekday">Вс</div>
        </div>
        
        <div class="days-grid" id="daysGrid"></div>
        
        <h3 style="margin-bottom: 12px;">Свободное время</h3>
        <div class="time-slots" id="timeSlots">
            <div class="time-slot available" onclick="selectTime(this)">10:00</div>
            <div class="time-slot available" onclick="selectTime(this)">12:00</div>
            <div class="time-slot booked">14:00</div>
            <div class="time-slot available" onclick="selectTime(this)">15:00</div>
            <div class="time-slot available" onclick="selectTime(this)">17:00</div>
            <div class="time-slot booked">18:00</div>
        </div>
        
        <button class="btn btn-primary" style="width: 100%;" onclick="proceedToPayment()">
            Перейти к оплате →
        </button>
    </div>
    
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">📅</span>
            <span>Календарь</span>
        </a>
        <a href="../payment/index.html" class="nav-item">
            <span class="nav-icon">💳</span>
            <span>Оплата</span>
        </a>
        <a href="../video/index.html" class="nav-item">
            <span class="nav-icon">📹</span>
            <span>Видео</span>
        </a>
    </div>
    
    <script src="../../shared/js/config.js"></script>
    <script>
        let tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand();
            tg.isFullscreen = true;
            tg.setHeaderColor('#8B4513');
            tg.setBackgroundColor('#FAF6F0');
            setTimeout(() => tg.expand(), 100);
            setTimeout(() => tg.expand(), 500);
            setTimeout(() => {
                tg.isFullscreen = true;
                tg.expand();
            }, 1000);
            if (tg.disableVerticalSwipes) {
                tg.disableVerticalSwipes();
            }
        }
        
        let currentDate = new Date(2026, 8, 1);
        let selectedDate = null;
        let selectedTime = null;
        
        function renderCalendar() {
            const monthTitle = document.getElementById('monthTitle');
            const daysGrid = document.getElementById('daysGrid');
            
            const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                           'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            
            monthTitle.textContent = `${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            
            const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            const lastDay = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
            
            let daysHTML = '';
            
            for (let i = 1; i < firstDay.getDay(); i++) {
                daysHTML += '<div></div>';
            }
            
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const date = new Date(currentDate.getFullYear(), currentDate.getMonth(), day);
                const isToday = date.toDateString() === new Date().toDateString();
                const isSelected = selectedDate && date.toDateString() === selectedDate.toDateString();
                
                daysHTML += `<div class="day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" 
                                  onclick="selectDate(${day})">${day}</div>`;
            }
            
            daysGrid.innerHTML = daysHTML;
        }
        
        function selectDate(day) {
            selectedDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), day);
            renderCalendar();
        
        // Кнопка Назад
        if (tg && tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(() => {
                window.location.href = "../../index.html";
            });
        }
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
        
        function selectTime(element) {
            document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
            element.classList.add('selected');
            selectedTime = element.textContent;
            if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
        
        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        
        // Кнопка Назад
        if (tg && tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(() => {
                window.location.href = "../../index.html";
            });
        }
        }
        
        function proceedToPayment() {
            if (!selectedDate || !selectedTime) {
                alert('Выберите дату и время занятия');
                return;
            }
            
            const bookingData = {
                date: selectedDate.toISOString(),
                time: selectedTime,
                lesson_type: 'TRIAL'
            };
            
            localStorage.setItem('pending_booking', JSON.stringify(bookingData));
            window.location.href = '../payment/index.html';
        }
        
        renderCalendar();
        
        // Кнопка Назад
        if (tg && tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(() => {
                window.location.href = "../../index.html";
            });
        }
    </script>
    <script src="../../shared/js/safe-area.js"></script>
</body>
</html>
