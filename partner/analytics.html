<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Аналитика — Партнёр</title>
    <style>
        :root { --primary: #8B4513; --bg-cream: #FAF6F0; --tg-hint: #999999; --success: #4CAF50; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-cream); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, #2C3E50, #34495E); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .section { padding: 16px; }
        .kpi { background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .kpi-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .kpi-name { font-size: 13px; font-weight: 600; }
        .kpi-value { font-size: 20px; font-weight: 700; color: var(--primary); }
        .kpi-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
        .kpi-fill { height: 100%; background: linear-gradient(90deg, var(--success), #2ECC71); }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
    <link rel="stylesheet" href="../shared/css/safe-area.css">
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Аналитика</div>
    </div>
    <div class="section">
        <div class="kpi">
            <div class="kpi-header"><span class="kpi-name">Рост учеников</span><span class="kpi-value">+12%</span></div>
            <div class="kpi-bar"><div class="kpi-fill" style="width: 78%"></div></div>
        </div>
        <div class="kpi">
            <div class="kpi-header"><span class="kpi-name">Заполняемость групп</span><span class="kpi-value">87%</span></div>
            <div class="kpi-bar"><div class="kpi-fill" style="width: 87%"></div></div>
        </div>
        <div class="kpi">
            <div class="kpi-header"><span class="kpi-name">Удержание (Retention)</span><span class="kpi-value">92%</span></div>
            <div class="kpi-bar"><div class="kpi-fill" style="width: 92%"></div></div>
        </div>
        <div class="kpi">
            <div class="kpi-header"><span class="kpi-name">Конверсия в оплату</span><span class="kpi-value">64%</span></div>
            <div class="kpi-bar"><div class="kpi-fill" style="width: 64%"></div></div>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Главная</span></a>
        <a href="franchise.html" class="nav-item"><span class="nav-icon">🏢</span><span>Франшиза</span></a>
        <a href="investors.html" class="nav-item"><span class="nav-icon">💰</span><span>Инвесторам</span></a>
        <a href="analytics.html" class="nav-item active"><span class="nav-icon">📊</span><span>Аналитика</span></a>
        <a href="../index.html" class="nav-item"><span class="nav-icon">🔙</span><span>Выход</span></a>
    </div>
    <script>let tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }</script>
    <script src="../shared/js/safe-area.js"></script>
</body>
</html>
