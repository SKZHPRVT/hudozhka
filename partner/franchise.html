<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Франшиза — Партнёр</title>
    <style>
        :root { --primary: #8B4513; --bg-cream: #FAF6F0; --tg-hint: #999999; --purple: #9B59B6; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-cream); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, #2C3E50, #34495E); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .section { padding: 16px; }
        .hero { background: linear-gradient(135deg, #9B59B6, #8E44AD); color: white; border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 16px; }
        .hero h2 { font-size: 20px; margin-bottom: 8px; }
        .hero p { font-size: 13px; opacity: 0.9; }
        .feature { background: white; border-radius: 12px; padding: 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .feature-icon { font-size: 28px; }
        .feature-title { font-weight: 600; font-size: 14px; }
        .feature-desc { font-size: 12px; color: var(--tg-hint); }
        .cta-btn { width: 100%; padding: 14px; background: var(--purple); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
    <link rel="stylesheet" href="../shared/css/safe-area.css">
<style data-safe-area-inline>html,body{padding-top:60px !important;margin-top:0 !important;}.top-bar{margin-top:0 !important;padding-top:calc(12px + env(safe-area-inset-top, 48px)) !important;}.fun-header,.dashboard-header,.app-header,.admin-header,.teacher-header,.partner-header,.profile-header{padding-top:calc(16px + env(safe-area-inset-top, 48px)) !important;}</style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Франшиза</div>
    </div>
    <div class="section">
        <div class="hero">
            <h2>🏢 Откройте школу Художка.ПРО</h2>
            <p>Готовая модель + бренд + технологии</p>
        </div>
        <div class="feature">
            <span class="feature-icon">🎨</span>
            <div><div class="feature-title">Готовый бренд</div><div class="feature-desc">Узнаваемое имя и методики</div></div>
        </div>
        <div class="feature">
            <span class="feature-icon">💻</span>
            <div><div class="feature-title">Mini App в комплекте</div><div class="feature-desc">CRM, расписание, оплата</div></div>
        </div>
        <div class="feature">
            <span class="feature-icon">👩‍🏫</span>
            <div><div class="feature-title">Обучение персонала</div><div class="feature-desc">Программы и тренинги</div></div>
        </div>
        <div class="feature">
            <span class="feature-icon">📈</span>
            <div><div class="feature-title">Маркетинг</div><div class="feature-desc">Продвижение и трафик</div></div>
        </div>
        <button class="cta-btn" onclick="alert('Оставить заявку на франшизу')">Оставить заявку</button>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Главная</span></a>
        <a href="franchise.html" class="nav-item active"><span class="nav-icon">🏢</span><span>Франшиза</span></a>
        <a href="investors.html" class="nav-item"><span class="nav-icon">💰</span><span>Инвесторам</span></a>
        <a href="analytics.html" class="nav-item"><span class="nav-icon">📊</span><span>Аналитика</span></a>
        <a href="../index.html" class="nav-item"><span class="nav-icon">🔙</span><span>Выход</span></a>
    </div>
    <script>let tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }</script>
    <script src="../shared/js/safe-area.js"></script>
</body>
</html>
