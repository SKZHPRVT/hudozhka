<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Рассылки — Администрация</title>
    <style>
        :root { --primary: #8B4513; --bg-cream: #FAF6F0; --tg-hint: #999999; --success: #4CAF50; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-cream); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, #8B4513, #D2691E); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .section { padding: 16px; }
        .add-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 16px; }
        .mailing { background: white; border-radius: 12px; padding: 14px; margin-bottom: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .mailing-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .mailing-title { font-weight: 600; font-size: 14px; }
        .mailing-badge { padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
        .badge-sent { background: #e8f5e9; color: var(--success); }
        .badge-draft { background: #f0f0f0; color: var(--tg-hint); }
        .mailing-text { font-size: 13px; color: #666; margin-bottom: 6px; }
        .mailing-stats { font-size: 11px; color: var(--tg-hint); }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Рассылки</div>
    </div>
    <div class="section">
        <button class="add-btn" onclick="alert('Создать рассылку')">+ Создать рассылку</button>
        <div class="mailing">
            <div class="mailing-header">
                <span class="mailing-title">Напоминание об оплате</span>
                <span class="mailing-badge badge-sent">Отправлено</span>
            </div>
            <div class="mailing-text">Уважаемые родители! Напоминаем о необходимости продлить абонемент</div>
            <div class="mailing-stats">📤 87 получателей • 10 сентября 14:30</div>
        </div>
        <div class="mailing">
            <div class="mailing-header">
                <span class="mailing-title">Новый курс по скетчингу</span>
                <span class="mailing-badge badge-draft">Черновик</span>
            </div>
            <div class="mailing-text">Открыт набор в новую группу по скетчингу...</div>
            <div class="mailing-stats">Черновик</div>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Главная</span></a>
        <a href="crm.html" class="nav-item"><span class="nav-icon">👥</span><span>Клиенты</span></a>
        <a href="finance.html" class="nav-item"><span class="nav-icon">💰</span><span>Финансы</span></a>
        <a href="reports.html" class="nav-item"><span class="nav-icon">📊</span><span>Отчёты</span></a>
        <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>Ещё</span></a>
    </div>
    <script>let tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }</script>
</body>
</html>
