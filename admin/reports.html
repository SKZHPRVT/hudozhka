<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Отчёты — Администрация</title>
    <style>
        :root { --primary: #8B4513; --bg-cream: #FAF6F0; --tg-hint: #999999; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-cream); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, #8B4513, #D2691E); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .section { padding: 16px; }
        .report-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; gap: 12px; align-items: center; cursor: pointer; }
        .report-card:active { transform: scale(0.98); }
        .report-icon { font-size: 32px; }
        .report-info { flex: 1; }
        .report-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
        .report-desc { font-size: 12px; color: var(--tg-hint); }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
    <link rel="stylesheet" href="../shared/css/safe-area.css">
<style data-safe-area-inline>html,body{padding-top:60px !important;margin-top:0 !important;}.top-bar{margin-top:0 !important;padding-top:calc(12px + env(safe-area-inset-top, 48px)) !important;}.fun-header,.dashboard-header,.app-header,.admin-header,.teacher-header,.partner-header,.profile-header{padding-top:calc(16px + env(safe-area-inset-top, 48px)) !important;}</style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Отчёты</div>
    </div>
    <div class="section">
        <div class="report-card" onclick="openReport('Выручка по месяцам', 'График дохода за год')">
            <span class="report-icon">📊</span>
            <div class="report-info">
                <div class="report-name">Выручка по месяцам</div>
                <div class="report-desc">График роста дохода</div>
            </div>
        </div>
        <div class="report-card" onclick="openReport('Ученики по группам', 'Заполняемость и активность')">
            <span class="report-icon">👥</span>
            <div class="report-info">
                <div class="report-name">Ученики по группам</div>
                <div class="report-desc">Заполняемость и активность</div>
            </div>
        </div>
        <div class="report-card" onclick="openReport('Воронка продаж', 'От заявки до оплаты')">
            <span class="report-icon">📈</span>
            <div class="report-info">
                <div class="report-name">Воронка продаж</div>
                <div class="report-desc">От заявки до оплаты</div>
            </div>
        </div>
        <div class="report-card" onclick="openReport('Успеваемость учеников', 'Оценки и посещаемость')">
            <span class="report-icon">🎓</span>
            <div class="report-info">
                <div class="report-name">Успеваемость учеников</div>
                <div class="report-desc">Оценки и посещаемость</div>
            </div>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Главная</span></a>
        <a href="crm.html" class="nav-item"><span class="nav-icon">👥</span><span>Клиенты</span></a>
        <a href="finance.html" class="nav-item"><span class="nav-icon">💰</span><span>Финансы</span></a>
        <a href="reports.html" class="nav-item active"><span class="nav-icon">📊</span><span>Отчёты</span></a>
        <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>Ещё</span></a>
    </div>
    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        function openReport(name, desc) {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            alert(`📊 ${name}\n\n${desc}\n\nВ полной версии здесь будут графики и интерактивные отчёты.`);
        }
    </script>
    <script src="../shared/js/safe-area.js"></script>
</body>
</html>
