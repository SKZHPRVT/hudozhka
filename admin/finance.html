<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Финансы — Администрация</title>
    <style>
        :root { --primary: #8B4513; --bg-cream: #FAF6F0; --tg-hint: #999999; --success: #4CAF50; --danger: #FF5722; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-cream); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, #8B4513, #D2691E); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .section { padding: 16px; }
        .money-card { background: linear-gradient(135deg, #4CAF50, #2ECC71); color: white; border-radius: 16px; padding: 20px; margin-bottom: 12px; }
        .money-card .label { font-size: 13px; opacity: 0.9; }
        .money-card .value { font-size: 32px; font-weight: 700; margin-top: 4px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat { background: white; border-radius: 12px; padding: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .stat .label { font-size: 12px; color: var(--tg-hint); }
        .stat .value { font-size: 18px; font-weight: 700; color: var(--primary); margin-top: 4px; }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
        .transaction { background: white; border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; gap: 12px; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .tr-icon { font-size: 24px; }
        .tr-info { flex: 1; }
        .tr-name { font-weight: 600; font-size: 13px; }
        .tr-date { font-size: 11px; color: var(--tg-hint); }
        .tr-amount { font-weight: 700; font-size: 15px; }
        .tr-amount.plus { color: var(--success); }
        .tr-amount.minus { color: var(--danger); }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
    <link rel="stylesheet" href="../shared/css/safe-area.css">
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Финансы</div>
    </div>
    <div class="section">
        <div class="money-card">
            <div class="label">Доход за сентябрь</div>
            <div class="value">184 500 ₽</div>
        </div>
        <div class="stats-grid">
            <div class="stat"><div class="label">Расходы</div><div class="value">62 300 ₽</div></div>
            <div class="stat"><div class="label">Прибыль</div><div class="value">122 200 ₽</div></div>
            <div class="stat"><div class="label">Зарплата</div><div class="value">85 000 ₽</div></div>
            <div class="stat"><div class="label">Аренда</div><div class="value">40 000 ₽</div></div>
        </div>
    </div>
    <div class="section">
        <h3 class="section-title">Последние операции</h3>
        <div class="transaction">
            <span class="tr-icon">💰</span>
            <div class="tr-info"><div class="tr-name">Оплата абонемента</div><div class="tr-date">Сегодня, 14:30</div></div>
            <span class="tr-amount plus">+5200 ₽</span>
        </div>
        <div class="transaction">
            <span class="tr-icon">💰</span>
            <div class="tr-info"><div class="tr-name">Оплата абонемента</div><div class="tr-date">Сегодня, 12:15</div></div>
            <span class="tr-amount plus">+2800 ₽</span>
        </div>
        <div class="transaction">
            <span class="tr-icon">📦</span>
            <div class="tr-info"><div class="tr-name">Закупка материалов</div><div class="tr-date">Вчера, 16:00</div></div>
            <span class="tr-amount minus">-8500 ₽</span>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Главная</span></a>
        <a href="crm.html" class="nav-item"><span class="nav-icon">👥</span><span>Клиенты</span></a>
        <a href="finance.html" class="nav-item active"><span class="nav-icon">💰</span><span>Финансы</span></a>
        <a href="reports.html" class="nav-item"><span class="nav-icon">📊</span><span>Отчёты</span></a>
        <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>Ещё</span></a>
    </div>
    <script>let tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }</script>
    <script src="../shared/js/safe-area.js"></script>
</body>
</html>
