<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Настройки — Администрация</title>
    <style>
        :root { --primary: #8B4513; --bg-cream: #FAF6F0; --tg-hint: #999999; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-cream); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, #8B4513, #D2691E); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .section { padding: 16px; }
        .setting-item { background: white; border-radius: 12px; padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); cursor: pointer; }
        .setting-item:active { transform: scale(0.98); }
        .setting-info { display: flex; gap: 12px; align-items: center; }
        .setting-icon { font-size: 24px; }
        .setting-name { font-size: 14px; font-weight: 500; }
        .setting-value { font-size: 13px; color: var(--tg-hint); }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Настройки</div>
    </div>
    <div class="section">
        <div class="setting-item" onclick="openSection('Информация о школе', '🏫 Название, адрес, логотип, контакты')">
            <div class="setting-info">
                <span class="setting-icon">🏫</span>
                <span class="setting-name">Информация о школе</span>
            </div>
            <span class="setting-value">→</span>
        </div>
        <div class="setting-item" onclick="openSection('Сотрудники', '👥 Управление доступом и ролями')">
            <div class="setting-info">
                <span class="setting-icon">👥</span>
                <span class="setting-name">Сотрудники</span>
            </div>
            <span class="setting-value">8</span>
        </div>
        <div class="setting-item" onclick="openSection('Курсы и программы', '📚 12 активных курсов')">
            <div class="setting-info">
                <span class="setting-icon">📚</span>
                <span class="setting-name">Курсы и программы</span>
            </div>
            <span class="setting-value">12</span>
        </div>
        <div class="setting-item" onclick="openSection('Платёжные системы', '💳 ЮKassa, СБП, Telegram Stars')">
            <div class="setting-info">
                <span class="setting-icon">💳</span>
                <span class="setting-name">Платёжные системы</span>
            </div>
            <span class="setting-value">→</span>
        </div>
        <div class="setting-item" onclick="openSection('Уведомления', '📢 Настройки рассылок и оповещений')">
            <div class="setting-info">
                <span class="setting-icon">📢</span>
                <span class="setting-name">Уведомления</span>
            </div>
            <span class="setting-value">→</span>
        </div>
        <div class="setting-item" onclick="openSection('Интеграции', '🔗 SaluteJazz, Telegram Bot, CRM')">
            <div class="setting-info">
                <span class="setting-icon">🔗</span>
                <span class="setting-name">Интеграции</span>
            </div>
            <span class="setting-value">SaluteJazz</span>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Главная</span></a>
        <a href="crm.html" class="nav-item"><span class="nav-icon">👥</span><span>Клиенты</span></a>
        <a href="finance.html" class="nav-item"><span class="nav-icon">💰</span><span>Финансы</span></a>
        <a href="reports.html" class="nav-item"><span class="nav-icon">📊</span><span>Отчёты</span></a>
        <a href="settings.html" class="nav-item active"><span class="nav-icon">⚙️</span><span>Ещё</span></a>
    </div>
    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        function openSection(name, desc) {
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            alert(`${name}\n\n${desc}\n\nВ полной версии здесь будет полноценный экран управления.`);
        }
    </script>
</body>
</html>
