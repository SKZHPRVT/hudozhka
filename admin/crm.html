<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Клиенты — Администрация</title>
    <style>
        :root { --primary: #8B4513; --bg-cream: #FAF6F0; --tg-hint: #999999; --success: #4CAF50; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-cream); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, #8B4513, #D2691E); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .search { padding: 16px; }
        .search input { width: 100%; padding: 12px 16px; border: none; border-radius: 12px; background: white; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .client-card { background: white; border-radius: 12px; padding: 14px; margin: 0 16px 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; gap: 12px; align-items: center; }
        .client-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #FFB6C1, #FF69B4); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .client-info { flex: 1; }
        .client-name { font-weight: 600; font-size: 14px; }
        .client-meta { font-size: 12px; color: var(--tg-hint); }
        .client-status { padding: 4px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .status-active { background: #e8f5e9; color: var(--success); }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Клиенты</div>
    </div>
    <div class="search"><input type="text" placeholder="🔍 Поиск клиента..."></div>
    
    <div class="client-card">
        <div class="client-avatar">👧</div>
        <div class="client-info">
            <div class="client-name">Аня Смирнова</div>
            <div class="client-meta">Акварель-2 • с 01.09.2026</div>
        </div>
        <span class="client-status status-active">Активен</span>
    </div>
    <div class="client-card">
        <div class="client-avatar">👦</div>
        <div class="client-info">
            <div class="client-name">Ваня Петров</div>
            <div class="client-meta">Скетчинг • с 15.08.2026</div>
        </div>
        <span class="client-status status-active">Активен</span>
    </div>
    <div class="client-card">
        <div class="client-avatar">👧</div>
        <div class="client-info">
            <div class="client-name">Маша Иванова</div>
            <div class="client-meta">Пастель • с 10.07.2026</div>
        </div>
        <span class="client-status status-active">Активен</span>
    </div>
    
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Главная</span></a>
        <a href="crm.html" class="nav-item active"><span class="nav-icon">👥</span><span>Клиенты</span></a>
        <a href="finance.html" class="nav-item"><span class="nav-icon">💰</span><span>Финансы</span></a>
        <a href="reports.html" class="nav-item"><span class="nav-icon">📊</span><span>Отчёты</span></a>
        <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>Ещё</span></a>
    </div>
    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
    </script>
</body>
</html>
