<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Расписание — Администрация</title>
    <style>
        :root { --primary: #8B4513; --bg-cream: #FAF6F0; --tg-hint: #999999; --info: #2196F3; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-cream); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, #8B4513, #D2691E); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .day-header { padding: 16px 16px 8px; font-weight: 700; font-size: 14px; color: var(--primary); text-transform: uppercase; }
        .lesson { background: white; border-radius: 12px; padding: 12px; margin: 0 16px 8px; display: flex; gap: 12px; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border-left: 4px solid var(--primary); }
        .lesson-time { font-weight: 700; color: var(--primary); font-size: 15px; min-width: 55px; }
        .lesson-info { flex: 1; }
        .lesson-name { font-weight: 600; font-size: 14px; }
        .lesson-teacher { font-size: 12px; color: var(--tg-hint); }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
    <link rel="stylesheet" href="../shared/css/safe-area.css">
<style data-safe-area-inline>html,body{padding-top:60px !important;margin-top:0 !important;}.top-bar{margin-top:0 !important;padding-top:calc(12px + env(safe-area-inset-top, 48px)) !important;}.fun-header,.dashboard-header,.app-header,.admin-header,.teacher-header,.partner-header,.profile-header{padding-top:calc(16px + env(safe-area-inset-top, 48px)) !important;}</style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Расписание школы</div>
    </div>
    <div class="day-header">Понедельник</div>
    <div class="lesson"><div class="lesson-time">10:00</div><div class="lesson-info"><div class="lesson-name">Акварель для начинающих</div><div class="lesson-teacher">Чеча М.И. • Ауд. 1</div></div></div>
    <div class="lesson"><div class="lesson-time">15:00</div><div class="lesson-info"><div class="lesson-name">Акварель ПРО</div><div class="lesson-teacher">Чеча М.И. • Ауд. 2</div></div></div>
    <div class="lesson"><div class="lesson-time">17:00</div><div class="lesson-info"><div class="lesson-name">Скетчинг</div><div class="lesson-teacher">Ткачёва О.И. • Ауд. 1</div></div></div>
    <div class="day-header">Вторник</div>
    <div class="lesson"><div class="lesson-time">14:00</div><div class="lesson-info"><div class="lesson-name">Пастель для новичков</div><div class="lesson-teacher">Горбатовская А.Л.</div></div></div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Главная</span></a>
        <a href="crm.html" class="nav-item"><span class="nav-icon">👥</span><span>Клиенты</span></a>
        <a href="finance.html" class="nav-item"><span class="nav-icon">💰</span><span>Финансы</span></a>
        <a href="reports.html" class="nav-item"><span class="nav-icon">📊</span><span>Отчёты</span></a>
        <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span><span>Ещё</span></a>
    </div>
    <script>let tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }</script>
    <script src="../shared/js/safe-area.js"></script>
</body>
</html>
