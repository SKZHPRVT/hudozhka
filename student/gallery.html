<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Мои работы — Мой кабинет</title>
    <style>
        :root { --pink: #FF69B4; --purple: #9B59B6; --bg-fun: linear-gradient(135deg, #FFE5F1, #E5F0FF); --tg-hint: #999999; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-fun); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, var(--pink), var(--purple)); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 16px; }
        .art { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 12px rgba(155,89,182,0.1); }
        .art-img { width: 100%; height: 140px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        .art-info { padding: 10px; }
        .art-title { font-weight: 700; font-size: 13px; }
        .art-stars { font-size: 12px; margin-top: 2px; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--pink); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Мои работы 🖼</div>
    </div>
    <div class="gallery">
        <div class="art">
            <div class="art-img" style="background: linear-gradient(135deg, #FFD700, #FF8C00);">🍂</div>
            <div class="art-info">
                <div class="art-title">Осенний лист</div>
                <div class="art-stars">⭐⭐⭐⭐⭐</div>
            </div>
        </div>
        <div class="art">
            <div class="art-img" style="background: linear-gradient(135deg, #FF6347, #FF4500);">🌅</div>
            <div class="art-info">
                <div class="art-title">Закат</div>
                <div class="art-stars">⭐⭐⭐⭐</div>
            </div>
        </div>
        <div class="art">
            <div class="art-img" style="background: linear-gradient(135deg, #FFB6C1, #FF69B4);">🌸</div>
            <div class="art-info">
                <div class="art-title">Цветы</div>
                <div class="art-stars">⭐⭐⭐⭐⭐</div>
            </div>
        </div>
        <div class="art">
            <div class="art-img" style="background: linear-gradient(135deg, #87CEEB, #4169E1);">🐱</div>
            <div class="art-info">
                <div class="art-title">Мой кот</div>
                <div class="art-stars">⭐⭐⭐⭐⭐</div>
            </div>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Дом</span></a>
        <a href="tasks.html" class="nav-item"><span class="nav-icon">📝</span><span>Задания</span></a>
        <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span>Игры</span></a>
        <a href="gallery.html" class="nav-item active"><span class="nav-icon">🖼</span><span>Работы</span></a>
        <a href="achievements.html" class="nav-item"><span class="nav-icon">🏆</span><span>Награды</span></a>
    </div>
    <script>let tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }</script>
</body>
</html>
