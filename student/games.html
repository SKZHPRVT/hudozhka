<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Игры — Мой кабинет</title>
    <style>
        :root { --pink: #FF69B4; --purple: #9B59B6; --bg-fun: linear-gradient(135deg, #FFE5F1, #E5F0FF); --tg-hint: #999999; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-fun); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, var(--pink), var(--purple)); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .section { padding: 16px; }
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .game-card { border-radius: 16px; padding: 20px; color: white; text-align: center; cursor: pointer; text-decoration: none; min-height: 130px; display: flex; flex-direction: column; justify-content: center; transition: transform 0.2s; }
        .game-card:active { transform: scale(0.95); }
        .game-card.pink { background: linear-gradient(135deg, #FF69B4, #FF1493); }
        .game-card.purple { background: linear-gradient(135deg, #9B59B6, #8E44AD); }
        .game-card.blue { background: linear-gradient(135deg, #3498DB, #2980B9); }
        .game-card.green { background: linear-gradient(135deg, #2ECC71, #27AE60); }
        .game-icon { font-size: 42px; margin-bottom: 8px; }
        .game-title { font-size: 15px; font-weight: 700; }
        .game-desc { font-size: 11px; opacity: 0.9; margin-top: 4px; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--pink); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
    <link rel="stylesheet" href="../shared/css/safe-area.css">
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Игры 🎮</div>
    </div>
    <div class="section">
        <div class="game-grid">
            <div class="game-card pink" onclick="alert('Игра: Смешай цвета!')">
                <div class="game-icon">🎨</div>
                <div class="game-title">Палитра</div>
                <div class="game-desc">Смешай цвета</div>
            </div>
            <div class="game-card purple" onclick="alert('Игра: Угадай художника!')">
                <div class="game-icon">🖼</div>
                <div class="game-title">Угадай</div>
                <div class="game-desc">Художника</div>
            </div>
            <div class="game-card blue" onclick="alert('Игра: Найди отличия!')">
                <div class="game-icon">🔍</div>
                <div class="game-title">Найди</div>
                <div class="game-desc">Отличия</div>
            </div>
            <div class="game-card green" onclick="alert('Игра: Раскрась картину!')">
                <div class="game-icon">🖌</div>
                <div class="game-title">Раскрась</div>
                <div class="game-desc">Картину</div>
            </div>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Дом</span></a>
        <a href="tasks.html" class="nav-item"><span class="nav-icon">📝</span><span>Задания</span></a>
        <a href="games.html" class="nav-item active"><span class="nav-icon">🎮</span><span>Игры</span></a>
        <a href="gallery.html" class="nav-item"><span class="nav-icon">🖼</span><span>Работы</span></a>
        <a href="achievements.html" class="nav-item"><span class="nav-icon">🏆</span><span>Награды</span></a>
    </div>
    <script>let tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }</script>
    <script src="../shared/js/safe-area.js"></script>
</body>
</html>
