<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Награды — Мой кабинет</title>
    <style>
        :root { --pink: #FF69B4; --purple: #9B59B6; --bg-fun: linear-gradient(135deg, #FFE5F1, #E5F0FF); --tg-hint: #999999; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-fun); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, var(--pink), var(--purple)); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .badges-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
        .badge { text-align: center; }
        .badge-icon { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 6px; background: linear-gradient(135deg, #FFD700, #FFA500); box-shadow: 0 4px 12px rgba(255,165,0,0.3); }
        .badge-icon.locked { background: #ddd; opacity: 0.5; }
        .badge-name { font-size: 11px; font-weight: 600; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--pink); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Мои награды 🏆</div>
    </div>
    <div class="badges-grid">
        <div class="badge"><div class="badge-icon">🎨</div><div class="badge-name">Первый рисунок</div></div>
        <div class="badge"><div class="badge-icon">⭐️</div><div class="badge-name">5 отличных</div></div>
        <div class="badge"><div class="badge-icon">🔥</div><div class="badge-name">10 дней подряд</div></div>
        <div class="badge"><div class="badge-icon">🌈</div><div class="badge-name">Мастер цвета</div></div>
        <div class="badge"><div class="badge-icon locked">🏆</div><div class="badge-name">Мастер года</div></div>
        <div class="badge"><div class="badge-icon locked">👑</div><div class="badge-name">Легенда</div></div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Дом</span></a>
        <a href="tasks.html" class="nav-item"><span class="nav-icon">📝</span><span>Задания</span></a>
        <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span>Игры</span></a>
        <a href="gallery.html" class="nav-item"><span class="nav-icon">🖼</span><span>Работы</span></a>
        <a href="achievements.html" class="nav-item active"><span class="nav-icon">🏆</span><span>Награды</span></a>
    </div>
    <script>let tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }</script>
</body>
</html>
