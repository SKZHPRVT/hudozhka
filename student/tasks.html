<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Задания — Мой кабинет</title>
    <style>
        :root { --pink: #FF69B4; --purple: #9B59B6; --bg-fun: linear-gradient(135deg, #FFE5F1, #E5F0FF); --tg-hint: #999999; --success: #4CAF50; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-fun); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, var(--pink), var(--purple)); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .section { padding: 16px; }
        .task { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(155,89,182,0.1); }
        .task-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
        .task-desc { font-size: 13px; color: #666; margin-bottom: 12px; line-height: 1.4; }
        .task-actions { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; }
        .btn-pink { background: var(--pink); color: white; }
        .btn-view { background: #f0f0f0; color: #666; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--pink); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
    <link rel="stylesheet" href="../shared/css/safe-area.css">
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Мои задания 📝</div>
    </div>
    <div class="section">
        <div class="task">
            <div class="task-title">🌸 Нарисуй осенний лист</div>
            <div class="task-desc">Используй тёплые цвета: жёлтый, оранжевый, красный</div>
            <div class="task-actions">
                <button class="btn btn-pink" onclick="alert('Загрузить фото')">📷 Загрузить</button>
            </div>
        </div>
        <div class="task">
            <div class="task-title">🐱 Нарисуй своего питомца</div>
            <div class="task-desc">Карандашом, формат А4</div>
            <div class="task-actions">
                <button class="btn btn-pink" onclick="alert('Загрузить фото')">📷 Загрузить</button>
            </div>
        </div>
        <div class="task">
            <div class="task-title">🌅 Морской закат</div>
            <div class="task-desc">Сдано! Ждёт проверки преподавателя</div>
            <div class="task-actions">
                <button class="btn btn-view">Посмотреть</button>
            </div>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Дом</span></a>
        <a href="tasks.html" class="nav-item active"><span class="nav-icon">📝</span><span>Задания</span></a>
        <a href="games.html" class="nav-item"><span class="nav-icon">🎮</span><span>Игры</span></a>
        <a href="gallery.html" class="nav-item"><span class="nav-icon">🖼</span><span>Работы</span></a>
        <a href="achievements.html" class="nav-item"><span class="nav-icon">🏆</span><span>Награды</span></a>
    </div>
    <script>let tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }</script>
    <script src="../shared/js/safe-area.js"></script>
</body>
</html>
