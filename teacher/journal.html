<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Журнал — Преподаватель</title>
    <style>
        :root { --primary: #8B4513; --bg-cream: #FAF6F0; --tg-hint: #999999; --success: #4CAF50; --danger: #FF5722; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-cream); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, #8B4513, #D2691E); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .selector { padding: 16px; }
        .selector select { width: 100%; padding: 12px; border-radius: 12px; border: none; background: white; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .student-row { background: white; border-radius: 12px; padding: 12px; margin: 0 16px 8px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .student-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #FFB6C1, #FF69B4); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .student-name { flex: 1; font-weight: 600; font-size: 14px; }
        .mark-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #ddd; background: white; cursor: pointer; font-size: 16px; margin-left: 4px; }
        .mark-btn.present { background: var(--success); color: white; border-color: var(--success); }
        .mark-btn.absent { background: var(--danger); color: white; border-color: var(--danger); }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
    <link rel="stylesheet" href="../shared/css/safe-area.css">
<style data-safe-area-inline>html,body{padding-top:60px !important;margin-top:0 !important;}.top-bar{margin-top:0 !important;padding-top:calc(12px + env(safe-area-inset-top, 48px)) !important;}.fun-header,.dashboard-header,.app-header,.admin-header,.teacher-header,.partner-header,.profile-header{padding-top:calc(16px + env(safe-area-inset-top, 48px)) !important;}</style>
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Журнал посещаемости</div>
    </div>
    <div class="selector">
        <select>
            <option>Группа А-1 • Акварель для начинающих</option>
            <option>Группа А-2 • Акварель ПРО</option>
            <option>Группа С-1 • Скетчинг</option>
        </select>
    </div>
    <div class="student-row">
        <div class="student-avatar">👧</div>
        <span class="student-name">Аня Смирнова</span>
        <button class="mark-btn present">✓</button>
        <button class="mark-btn">✗</button>
    </div>
    <div class="student-row">
        <div class="student-avatar">👦</div>
        <span class="student-name">Ваня Петров</span>
        <button class="mark-btn">✓</button>
        <button class="mark-btn absent">✗</button>
    </div>
    <div class="student-row">
        <div class="student-avatar">👧</div>
        <span class="student-name">Маша Иванова</span>
        <button class="mark-btn present">✓</button>
        <button class="mark-btn">✗</button>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Главная</span></a>
        <a href="schedule.html" class="nav-item"><span class="nav-icon">📅</span><span>Расписание</span></a>
        <a href="journal.html" class="nav-item active"><span class="nav-icon">📋</span><span>Журнал</span></a>
        <a href="students.html" class="nav-item"><span class="nav-icon">👥</span><span>Ученики</span></a>
        <a href="chat.html" class="nav-item"><span class="nav-icon">💬</span><span>Чаты</span></a>
    </div>
    <script>let tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }</script>
    <script src="../shared/js/safe-area.js"></script>
</body>
</html>
