<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="telegram-web-app-capable" content="yes">
    <title>Чаты — Преподаватель</title>
    <style>
        :root { --primary: #8B4513; --bg-cream: #FAF6F0; --tg-hint: #999999; --danger: #FF5722; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-cream); max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; }
        .top-bar { background: linear-gradient(135deg, #8B4513, #D2691E); color: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .top-bar-title { font-size: 16px; font-weight: 600; }
        .chat-item { background: white; border-radius: 12px; padding: 12px; margin: 8px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); cursor: pointer; }
        .chat-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .chat-info { flex: 1; }
        .chat-name { font-weight: 600; font-size: 14px; }
        .chat-msg { font-size: 12px; color: var(--tg-hint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-badge { background: var(--danger); color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 20px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--tg-hint); text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
    <link rel="stylesheet" href="../shared/css/safe-area.css">
</head>
<body>
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
        <div class="top-bar-title">Чаты с родителями</div>
    </div>
    <div class="chat-item">
        <div class="chat-avatar" style="background: #FFE4E1;">👩</div>
        <div class="chat-info">
            <div class="chat-name">Мама Ани</div>
            <div class="chat-msg">Спасибо за занятие! Аня в восторге</div>
        </div>
        <span class="chat-badge">2</span>
    </div>
    <div class="chat-item">
        <div class="chat-avatar" style="background: #E0F7FA;">👨</div>
        <div class="chat-info">
            <div class="chat-name">Папа Вани</div>
            <div class="chat-msg">Когда следующее занятие?</div>
        </div>
        <span class="chat-badge">1</span>
    </div>
    <div class="chat-item">
        <div class="chat-avatar" style="background: #F0E6D8;">👩</div>
        <div class="chat-info">
            <div class="chat-name">Мама Маши</div>
            <div class="chat-msg">Хорошо, спасибо!</div>
        </div>
    </div>
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span>Главная</span></a>
        <a href="schedule.html" class="nav-item"><span class="nav-icon">📅</span><span>Расписание</span></a>
        <a href="journal.html" class="nav-item"><span class="nav-icon">📋</span><span>Журнал</span></a>
        <a href="students.html" class="nav-item"><span class="nav-icon">👥</span><span>Ученики</span></a>
        <a href="chat.html" class="nav-item active"><span class="nav-icon">💬</span><span>Чаты</span></a>
    </div>
    <script>let tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }</script>
    <script src="../shared/js/safe-area.js"></script>
</body>
</html>
